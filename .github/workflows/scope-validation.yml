name: Dinext Project Scope validation
'on':
  workflow_call: {}
permissions:
  contents: read
jobs:
  checks:
    name: Repository checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Dinext-pro/dinext-common
          ref: main
          path: ci-support
          sparse-checkout: .github/ci
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python ci-support/.github/ci/check_repository.py "$GITHUB_WORKSPACE"
  acceptance:
    name: ${{ matrix.check }}
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: server
            check: App unit tests
          - suite: browser
            check: Cypress acceptance
    services:
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: ci
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -h localhost -pci" --health-interval=10s --health-timeout=5s --health-retries=12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
      - name: Install acceptance tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mariadb-client libmariadb-dev libmariadb-dev-compat libxml2-dev libxslt1-dev libffi-dev libjpeg-dev zlib1g-dev redis-tools xvfb libgtk-3-0t64 libnss3 libasound2t64 libgbm1
          python -m pip install frappe-bench==5.29.0
          npm install --global yarn@1.22.22
          sudo install -d -o "$(id -un)" -g "$(id -gn)" /home/frappe
          ln -s "$RUNNER_TEMP/dinext-test-bench" /home/frappe/frappe-bench
      - name: Run acceptance at the checked-out revision
        env:
          CI: 'true'
          DINEXT_DEPLOY_ENABLED: 'false'
          DINEXT_NOTIFICATIONS_ENABLED: 'false'
          DINEXT_DOCS_AGENT_ENABLED: '0'
        run: python .github/ci/scope_acceptance.py '${{ matrix.suite }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: scope-${{ matrix.suite }}-results
          path: ${{ runner.temp }}/scope-acceptance/
          if-no-files-found: warn
          retention-days: 14
